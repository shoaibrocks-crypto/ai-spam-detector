plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.antigravity.aispamdetector'
    compileSdk 34
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId "com.antigravity.aispamdetector"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        release {
            storeFile file("../release-key.jks")
            storePassword "SpamGuardSecure2026"
            keyAlias "spamguard"
            keyPassword "SpamGuardSecure2026"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // 100% Pure Android & Kotlin runtime - zero external Maven packages to download!
}
